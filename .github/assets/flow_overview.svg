<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 650" role="img" aria-label="Cressetide component flow: the vigil run contains plan-implement-verify and the risk-selected subagent panel; salvage, map, committed memory files, and the local run ledger feed it">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">

    <!-- ========== vigil container (skill boundary) ========== -->
    <g>
      <rect x="625" y="62" width="645" height="190" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="7 5"/>
      <text x="645" y="92" font-size="16" font-weight="700" fill="#1e3a8a">vigil · the dev flow</text>
    </g>

    <!-- ========== edges ========== -->
    <g fill="none" stroke="#8b949e" stroke-width="2">
      <path d="M312,66 Q480,86 638,124" marker-end="url(#arrow)"/>            <!-- H -> plan -->
      <path d="M222,244 Q245,252 266,262" marker-end="url(#arrow)"/>          <!-- map -> SYSTEM_MAP -->
      <path d="M492,258 Q565,215 640,150" marker-end="url(#arrow)"/>          <!-- SYSTEM_MAP -> plan -->
      <path d="M440,298 Q460,318 478,336" marker-end="url(#arrow)"/>          <!-- SYSTEM_MAP -> salvage -->
      <path d="M272,440 Q320,420 366,390" marker-end="url(#arrow)"/>          <!-- P -> salvage -->
      <path d="M897,140 L962,140" marker-end="url(#arrow)"/>                  <!-- phases -> panel -->
      <path d="M1005,180 Q950,202 887,174" marker-end="url(#arrow)"/>         <!-- panel -> phases (FIX REQUIRED) -->
      <path d="M1244,140 L1326,140" marker-end="url(#arrow)"/>                <!-- panel -> delivery (READY) -->
      <path d="M642,346 Q680,270 700,176" marker-end="url(#arrow)"/>          <!-- salvage -> plan (formal fix) -->
      <path d="M1200,180 Q1265,240 1283,324" marker-end="url(#arrow)"/>       <!-- panel -> ledger (run record) -->
      <path d="M1178,368 Q970,330 844,176" marker-end="url(#arrow)"/>         <!-- ledger -> plan (reconcile) -->
      <path d="M560,402 Q635,472 726,506" marker-end="url(#arrow)"/>          <!-- salvage -> memory (postmortem) -->
      <path d="M858,478 Q800,330 774,176" marker-end="url(#arrow)"/>          <!-- memory -> plan (read at planning) -->
    </g>

    <!-- ========== edge labels ========== -->
    <g font-size="12.5">
      <g><rect x="227" y="210" width="56" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
         <text x="255" y="226" text-anchor="middle" fill="#57606a">builds</text></g>
      <g><rect x="1256" y="104" width="58" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
         <text x="1285" y="120" text-anchor="middle" fill="#57606a">READY</text></g>
      <g><rect x="897" y="186" width="106" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
         <text x="950" y="202" text-anchor="middle" fill="#57606a">FIX REQUIRED</text></g>
      <g><rect x="632" y="278" width="126" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
         <text x="695" y="294" text-anchor="middle" fill="#57606a">formal fix (--lite)</text></g>
      <g><rect x="1254" y="234" width="92" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
         <text x="1300" y="250" text-anchor="middle" fill="#57606a">run record</text></g>
      <g><rect x="916" y="308" width="168" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
         <text x="1000" y="324" text-anchor="middle" fill="#57606a">next planning reconciles</text></g>
      <g><rect x="551" y="450" width="122" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
         <text x="612" y="466" text-anchor="middle" fill="#57606a">postmortem rule</text></g>
      <g><rect x="794" y="356" width="122" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
         <text x="855" y="372" text-anchor="middle" fill="#57606a">read at planning</text></g>
    </g>

    <!-- ========== nodes ========== -->

    <!-- Human intent (stadium, gray) -->
    <g>
      <rect x="60" y="40" width="250" height="52" rx="26" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
      <text x="185" y="71" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Human intent + approval</text>
    </g>

    <!-- phases inside vigil (skill rect, blue) -->
    <g>
      <rect x="645" y="110" width="250" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="770" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">plan → implement → verify</text>
    </g>

    <!-- panel + arbiter inside vigil (hexagon, teal) -->
    <g>
      <polygon points="992,102 1220,102 1242,140 1220,178 992,178 970,140" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
      <text x="1106" y="135" text-anchor="middle" font-size="15" font-weight="600" fill="#134e4a">risk-selected panel</text>
      <text x="1106" y="155" text-anchor="middle" font-size="15" font-weight="600" fill="#134e4a">→ arbiter verdict</text>
    </g>

    <!-- salvage (skill rect, blue) -->
    <g>
      <rect x="370" y="340" width="270" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="505" y="375" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">salvage · the incident flow</text>
    </g>

    <!-- map (skill rect, blue) -->
    <g>
      <rect x="60" y="210" width="160" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="140" y="245" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">map</text>
    </g>

    <!-- SYSTEM_MAP.md (document, purple) -->
    <g>
      <path d="M270,240 h206 l14,14 v42 h-220 z" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
      <path d="M476,240 v14 h14" fill="none" stroke="#9333ea" stroke-width="1.5"/>
      <text x="380" y="273" text-anchor="middle" font-size="15" font-weight="600" fill="#581c87">SYSTEM_MAP.md</text>
    </g>

    <!-- Production signal (stadium, gray) -->
    <g>
      <rect x="60" y="420" width="210" height="52" rx="26" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
      <text x="165" y="451" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Production signal</text>
    </g>

    <!-- Reviewed delivery (stadium, green) -->
    <g>
      <rect x="1330" y="114" width="190" height="52" rx="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="1425" y="145" text-anchor="middle" font-size="14.5" font-weight="600" fill="#14532d">Reviewed delivery</text>
    </g>

    <!-- ledger (cylinder, amber) -->
    <g>
      <path d="M1180,342 v48 a105,12 0 0 0 210,0 v-48" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <ellipse cx="1285" cy="342" rx="105" ry="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="1285" y="382" text-anchor="middle" font-size="15" font-weight="600" fill="#78350f">ledger · runs.jsonl</text>
    </g>

    <!-- FAILURE_MEMORY + EXPERIENCE (document, purple) -->
    <g>
      <path d="M730,480 h286 l14,14 v46 h-300 z" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
      <path d="M1016,480 v14 h14" fill="none" stroke="#9333ea" stroke-width="1.5"/>
      <text x="880" y="515" text-anchor="middle" font-size="15" font-weight="600" fill="#581c87">FAILURE_MEMORY + EXPERIENCE</text>
    </g>

    <!-- ========== legend ========== -->
    <g>
      <rect x="230" y="580" width="1090" height="50" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
      <g font-size="12.5" fill="#57606a">
        <rect x="250" y="595" width="34" height="20" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
        <text x="290" y="609">Skill</text>
        <rect x="348" y="595" width="34" height="20" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4 3"/>
        <text x="388" y="609">Skill boundary</text>
        <polygon points="484,595 512,595 520,605 512,615 484,615 476,605" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
        <text x="526" y="609">Subagent panel</text>
        <path d="M644,593 h27 l7,7 v17 h-34 z" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2"/>
        <text x="684" y="609">Committed memory file</text>
        <path d="M846,597 v14 a17,3.5 0 0 0 34,0 v-14" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
        <ellipse cx="863" cy="597" rx="17" ry="3.5" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
        <text x="886" y="609">Local run ledger</text>
        <rect x="1012" y="595" width="34" height="20" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
        <text x="1052" y="609">Human / external signal</text>
        <rect x="1220" y="595" width="34" height="20" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="1260" y="609">Outcome</text>
      </g>
    </g>

  </g>
</svg>
