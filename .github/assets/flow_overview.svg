<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 730" role="img" aria-label="Cressetide component flow: intent leads to a plan, the human approves it, then vigil implements and verifies before the risk-selected subagent panel decides; salvage, map, committed memory files, and the local run ledger feed the loop; doctor and ship are manually-triggered, standalone read-only checks with no loop connection">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">

    <!-- ========== vigil container (skill boundary) ========== -->
    <g>
      <rect x="560" y="55" width="850" height="190" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="7 5"/>
      <text x="580" y="85" font-size="16" font-weight="700" fill="#1e3a8a">vigil · the dev flow</text>
    </g>

    <!-- ========== edges ========== -->
    <g fill="none" stroke="#8b949e" stroke-width="2">
      <path d="M262,65 Q420,60 588,110" marker-end="url(#arrow)"/>            <!-- Human intent -> plan -->
      <path d="M700,132 L798,132" marker-end="url(#arrow)"/>                 <!-- plan -> implement (you approve) -->
      <path d="M1020,132 L1048,132" marker-end="url(#arrow)"/>               <!-- implement -> hexagon -->
      <path d="M200,237 Q233,236 268,240" marker-end="url(#arrow)"/>         <!-- map -> SYSTEM_MAP -->
      <path d="M470,255 Q530,190 588,138" marker-end="url(#arrow)"/>         <!-- SYSTEM_MAP -> plan -->
      <path d="M270,425 Q350,420 428,417" marker-end="url(#arrow)"/>         <!-- Production -> salvage -->
      <path d="M600,390 Q660,270 648,158" marker-end="url(#arrow)"/>         <!-- salvage -> plan (formal fix) -->
      <path d="M1350,132 Q1400,132 1458,132" marker-end="url(#arrow)"/>      <!-- hexagon -> delivery (READY) -->
      <path d="M1240,174 Q1400,192 1500,227" marker-end="url(#arrow)"/>      <!-- hexagon -> ledger (run record) -->
      <path d="M1450,282 Q980,420 650,162" marker-end="url(#arrow)"/>        <!-- ledger -> plan (reconcile) -->
      <path d="M730,417 L798,417" marker-end="url(#arrow)"/>                <!-- salvage -> memory (postmortem) -->
      <path d="M900,390 Q750,268 700,164" marker-end="url(#arrow)"/>         <!-- memory -> plan (read at planning) -->
    </g>

    <!-- ========== edge labels ========== -->
    <g font-size="12.5">
      <g><rect x="703" y="119" width="94" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de"/>
         <text x="750" y="137" text-anchor="middle" fill="#57606a">you approve</text></g>
      <g><rect x="207" y="224" width="56" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
         <text x="235" y="240" text-anchor="middle" fill="#57606a">builds</text></g>
      <g><rect x="1370" y="119" width="65" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de"/>
         <text x="1402" y="137" text-anchor="middle" fill="#57606a">READY</text></g>
      <g><rect x="536" y="329" width="170" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de"/>
         <text x="621" y="347" text-anchor="middle" fill="#57606a">formal fix (--lite)</text></g>
      <g><rect x="1370" y="195" width="95" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de"/>
         <text x="1417" y="213" text-anchor="middle" fill="#57606a">run record</text></g>
      <g><rect x="1000" y="315" width="185" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de"/>
         <text x="1092" y="333" text-anchor="middle" fill="#57606a">next planning reconciles</text></g>
      <text x="764" y="465" text-anchor="middle" font-size="11" fill="#57606a">postmortem rule</text>
      <g><rect x="776" y="329" width="135" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de"/>
         <text x="844" y="347" text-anchor="middle" fill="#57606a">read at planning</text></g>
    </g>

    <!-- ========== nodes ========== -->

    <!-- Human intent (stadium, gray) -->
    <g>
      <rect x="60" y="40" width="200" height="50" rx="25" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
      <text x="160" y="71" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Human intent</text>
    </g>

    <!-- plan (skill sub-step rect, blue) -->
    <g>
      <rect x="590" y="105" width="110" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="645" y="138" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">plan</text>
    </g>

    <!-- implement -> verify (skill sub-step rect, blue) -->
    <g>
      <rect x="800" y="105" width="220" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="910" y="138" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">implement → verify</text>
    </g>

    <!-- panel + arbiter inside vigil (hexagon, teal) -->
    <g>
      <polygon points="1075,90 1325,90 1350,132 1325,174 1075,174 1050,132" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
      <text x="1200" y="127" text-anchor="middle" font-size="15" font-weight="600" fill="#134e4a">risk-selected panel</text>
      <text x="1200" y="147" text-anchor="middle" font-size="15" font-weight="600" fill="#134e4a">→ arbiter verdict</text>
    </g>

    <!-- FIX REQUIRED loop-back (hexagon -> implement) -->
    <g fill="none" stroke="#8b949e" stroke-width="2">
      <path d="M1140,174 Q1000,220 918,163" marker-end="url(#arrow)"/>
    </g>
    <g font-size="12.5">
      <g><rect x="960" y="200" width="106" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de"/>
         <text x="1013" y="218" text-anchor="middle" fill="#57606a">FIX REQUIRED</text></g>
    </g>

    <!-- map (skill rect, blue) -->
    <g>
      <rect x="60" y="210" width="140" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="130" y="242" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">map</text>
    </g>

    <!-- SYSTEM_MAP.md (document, purple) -->
    <g>
      <path d="M270,235 h186 l14,14 v41 h-200 z" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
      <path d="M456,235 v14 h14" fill="none" stroke="#9333ea" stroke-width="1.5"/>
      <text x="370" y="267" text-anchor="middle" font-size="15" font-weight="600" fill="#581c87">SYSTEM_MAP.md</text>
    </g>

    <!-- Production signal (stadium, gray) -->
    <g>
      <rect x="60" y="400" width="210" height="50" rx="25" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
      <text x="165" y="430" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Production signal</text>
    </g>

    <!-- salvage (skill rect, blue) -->
    <g>
      <rect x="430" y="390" width="300" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="580" y="422" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">salvage · the incident flow</text>
    </g>

    <!-- Reviewed delivery (stadium, green) -->
    <g>
      <rect x="1460" y="105" width="210" height="50" rx="25" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="1565" y="135" text-anchor="middle" font-size="14.5" font-weight="600" fill="#14532d">Reviewed delivery</text>
    </g>

    <!-- ledger (cylinder, amber) -->
    <g>
      <path d="M1450,230 v55 a115,11 0 0 0 230,0 v-55" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <ellipse cx="1565" cy="230" rx="115" ry="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="1565" y="312" text-anchor="middle" font-size="15" font-weight="600" fill="#78350f">ledger · runs.jsonl</text>
    </g>

    <!-- FAILURE_MEMORY + EXPERIENCE (document, purple) -->
    <g>
      <path d="M800,390 h316 l14,14 v41 h-330 z" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
      <path d="M1116,390 v14 h14" fill="none" stroke="#9333ea" stroke-width="1.5"/>
      <text x="965" y="422" text-anchor="middle" font-size="15" font-weight="600" fill="#581c87">FAILURE_MEMORY + EXPERIENCE</text>
    </g>

    <!-- ========== standalone tools container (skill boundary, same dashed style as vigil) ========== -->
    <g>
      <rect x="60" y="500" width="520" height="110" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="7 5"/>
      <text x="80" y="530" font-size="16" font-weight="700" fill="#1e3a8a">Manually-triggered, standalone</text>
      <text x="80" y="548" font-size="12.5" fill="#57606a">Read-only checks — no loop edges in or out</text>
      <rect x="80" y="560" width="210" height="45" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="185" y="588" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">doctor</text>
      <rect x="310" y="560" width="210" height="45" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="415" y="588" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">ship</text>
    </g>

    <!-- ========== legend ========== -->
    <g>
      <rect x="60" y="650" width="1340" height="55" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
      <g font-size="12.5" fill="#57606a">
        <rect x="90" y="666" width="34" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
        <text x="132" y="682">Skill</text>
        <rect x="195" y="666" width="34" height="22" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4 3"/>
        <text x="237" y="682">Skill boundary</text>
        <polygon points="345,666 379,666 389,677 379,688 345,688 335,677" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
        <text x="397" y="682">Subagent panel</text>
        <path d="M545,663 h30 l8,8 v19 h-38 z" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2"/>
        <text x="593" y="682">Committed memory file</text>
        <path d="M765,668 v14 a17,3.5 0 0 0 34,0 v-14" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
        <ellipse cx="782" cy="668" rx="17" ry="3.5" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
        <text x="805" y="682">Local run ledger</text>
        <rect x="960" y="666" width="34" height="22" rx="11" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
        <text x="1002" y="682">Human / external signal</text>
        <rect x="1230" y="666" width="34" height="22" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="1272" y="682">Outcome</text>
      </g>
    </g>

  </g>
</svg>
