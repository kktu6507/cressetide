name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctide-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: Validate structure and text integrity
        run: npm run validate
      - name: Run tests
        run: npm test
      - name: Run evaluation cases
        run: npm run eval
      - name: Validate Claude Code marketplace
        if: runner.os == 'Linux'
        run: npx --yes @anthropic-ai/claude-code@2.1.207 plugin validate --strict .
      - name: Validate Claude Code plugin
        if: runner.os == 'Linux'
        run: npx --yes @anthropic-ai/claude-code@2.1.207 plugin validate --strict ./cressetide
      - name: Syntax-check release publisher
        run: node --check .github/scripts/publish-release.mjs
