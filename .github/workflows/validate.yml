name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctide-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Windows runs the same suite far slower: a measured 842,922 ms test step inside a ~14m37s job,
    # against a 15-minute cap, left the later steps roughly 23 seconds. That job COMPLETED and
    # reported a real test failure — it did not time out — so this is prospective headroom for the
    # steps it never reached, not a response to a timeout. Other platforms are unchanged.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 20 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Validate structure and text integrity
        run: npm run validate
      - name: Run tests
        run: npm test
      - name: Run evaluation cases
        run: npm run eval
      - name: Validate Claude Code plugin
        if: runner.os == 'Linux'
        run: npx --yes @anthropic-ai/claude-code@2.1.207 plugin validate --strict ./cressetide
      - name: Syntax-check release publisher
        run: node --check .github/scripts/publish-release.mjs
