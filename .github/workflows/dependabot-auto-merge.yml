name: Dependabot auto-merge

# Only inspect metadata. Never check out or execute pull-request code with this token.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >-
      github.repository == 'kktu6507/cressetide' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Cancel any earlier auto-merge request before verification
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          requested="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [[ "$requested" == "true" ]]; then
            gh pr merge "$PR_URL" --disable-auto
          fi
      - name: Verify Dependabot metadata and commit signatures
        id: metadata
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7
        with:
          github-token: ${{ github.token }}
      - name: Apply the dependency auto-merge policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        shell: bash
        run: |
          set -euo pipefail
          require_manual_review() {
            echo "$1"
            requested="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')"
            if [[ "$requested" == "true" ]]; then
              gh pr merge "$PR_URL" --disable-auto
            fi
            exit 0
          }
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *) require_manual_review "Update type requires manual review: $UPDATE_TYPE" ;;
          esac
          IFS=',' read -ra dependencies <<< "$DEPENDENCY_NAMES"
          test "${#dependencies[@]}" -gt 0
          for dependency in "${dependencies[@]}"; do
            dependency="${dependency//[[:space:]]/}"
            case "$dependency" in
              actions/checkout|actions/setup-node|dependabot/fetch-metadata|actions/attest-build-provenance|crate-ci/typos|lycheeverse/lychee-action) ;;
              *) require_manual_review "Dependency requires manual review: $dependency" ;;
            esac
          done
          files="$(gh pr view "$PR_URL" --json files --jq '.files[].path')"
          test -n "$files"
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/*.yml|.github/workflows/*.yaml) ;;
              *) require_manual_review "File requires manual review: $file" ;;
            esac
          done <<< "$files"
          # GitHub branch protection enforces all required CI checks on the current head.
          gh pr merge "$PR_URL" --auto --squash --match-head-commit "$PR_HEAD_SHA"
